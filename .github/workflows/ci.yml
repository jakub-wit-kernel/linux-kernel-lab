# SPDX-License-Identifier: GPL-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: Test tooling and shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python helper unit tests (kmsg.py, nettool.py)
        run: python3 -m unittest discover -s tests/lib -v
      - name: libbpf (pinned release) for the eBPF build
        run: |
          sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev
          scripts/build-libbpf.sh
      - name: User-space and eBPF build, unit tests (gcc, clang, ASan+UBSan)
        run: |
          bpf=-DLKL_LIBBPF_DIR=$PWD/.tools/libbpf
          for cc in gcc clang; do
            rm -rf b && CC=$cc cmake -S . -B b "$bpf" >/dev/null
            cmake --build b -j
            test -x b/lklbpf && ls b/ebpf/*.bpf.o
            (cd b && ctest --output-on-failure)
          done
          rm -rf b && cmake -S . -B b "$bpf" -DLKL_SANITIZE=address,undefined >/dev/null
          cmake --build b -j
          (cd b && ctest --output-on-failure)
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x -P SCRIPTDIR scripts/*.sh tests/run_all.sh tests/modules/*.sh tests/drivers/*.sh tests/concurrency/*.sh tests/memory/*.sh tests/networking/*.sh tests/ebpf/*.sh tests/debug/*.sh tests/lib/common.sh tests/lib/net.sh tests/lib/bpf.sh benchmarks/xdp/run.sh

  build:
    name: Build and static analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Kernel headers and matching compiler
        run: |
          cat /proc/version
          KCC=$(scripts/kernel-cc.sh)
          sudo apt-get update
          sudo apt-get install -y "linux-headers-$(uname -r)" sparse "$KCC"
          echo "KCC=$KCC" >> "$GITHUB_ENV"
      - name: Build (warnings are errors)
        run: make CC="$KCC"
      - name: W=1
        run: make w1 CC="$KCC"
      - name: sparse
        run: make sparse CC="$KCC"
      # Fetch the pinned checkpatch.pl once and reuse it: unauthenticated
      # downloads from raw.githubusercontent.com get rate-limited (HTTP 429).
      - name: Cache checkpatch (pinned tag)
        id: cp-cache
        uses: actions/cache@v4
        with:
          path: .tools
          key: checkpatch-v6.12
      - name: Fetch checkpatch
        if: steps.cp-cache.outputs.cache-hit != 'true'
        run: scripts/checkpatch.sh --fetch
      - name: checkpatch (upstream, pinned tag)
        run: scripts/checkpatch.sh

  test-host:
    name: Module tests on runner kernel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Kernel headers and matching compiler
        run: |
          KCC=$(scripts/kernel-cc.sh)
          sudo apt-get update
          sudo apt-get install -y "linux-headers-$(uname -r)" "$KCC" ethtool \
            libelf-dev zlib1g-dev
          echo "KCC=$KCC" >> "$GITHUB_ENV"
      - run: make CC="$KCC"
      - name: libbpf (pinned release)
        run: scripts/build-libbpf.sh
      - name: Build user-space tools and eBPF programs
        run: |
          cmake -S . -B build -DLKL_LIBBPF_DIR="$PWD/.tools/libbpf"
          cmake --build build -j
      - name: Run module and eBPF tests
        run: sudo LKL_EXPECT_BPF=1 timeout 900 tests/run_all.sh
      - name: XDP drop benchmark (informational numbers)
        run: sudo benchmarks/xdp/run.sh 1000000
      - name: Kernel log (on failure)
        if: failure()
        run: sudo dmesg | tail -n 200

  test-qemu:
    name: Module tests inside QEMU (virtme-ng)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm: QEMU will use software emulation"
      - name: Install QEMU, virtme-ng, headers
        run: |
          KCC=$(scripts/kernel-cc.sh)
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 "linux-headers-$(uname -r)" "$KCC" ethtool \
            libelf-dev zlib1g-dev
          pipx install virtme-ng
          echo "KCC=$KCC" >> "$GITHUB_ENV"
          sudo chmod 0644 "/boot/vmlinuz-$(uname -r)"
      - name: libbpf (pinned release)
        run: |
          scripts/build-libbpf.sh
          echo "LKL_CMAKE_ARGS=-DLKL_LIBBPF_DIR=$PWD/.tools/libbpf" >> "$GITHUB_ENV"
      - name: Run module and eBPF tests in a VM booting the runner's kernel
        run: timeout 2100 scripts/qemu-test.sh
        env:
          CC: ${{ env.KCC }}
          LKL_EXPECT_BPF: "1"

  test-debug-kernel:
    name: Tests on a debug kernel (lockdep + KASAN + kmemleak) in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      KVER: "6.12"
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm: QEMU will use software emulation"
      - name: Install build dependencies, QEMU, virtme-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 flex bison bc libelf-dev libssl-dev ethtool
          pipx install virtme-ng
      - name: Restore the debug kernel build
        id: kcache
        uses: actions/cache@v4
        with:
          path: kernel
          key: debug-kernel-${{ env.KVER }}-${{ hashFiles('scripts/build-debug-kernel.sh') }}
      - name: Build the debug kernel (cache miss only)
        if: steps.kcache.outputs.cache-hit != 'true'
        run: scripts/build-debug-kernel.sh "$KVER" kernel
      - name: Show the detector configuration
        run: grep -E '^CONFIG_(PROVE_LOCKING|KASAN|KASAN_GENERIC|DEBUG_ATOMIC_SLEEP|DEBUG_LIST|DEBUG_KMEMLEAK|DYNAMIC_DEBUG|NET_NS|NETFILTER)=' kernel/.config
      - name: Run all tests, then the detector demonstrations, in the VM
        run: timeout 2400 scripts/qemu-test.sh kernel/arch/x86/boot/bzImage "$PWD/kernel"
        env:
          LKL_EXPECT_DETECTORS: "1"
          LKL_QEMU_MEM: 2G
          # More than one KASAN report per boot (M4 and M5 demos).
          LKL_QEMU_APPEND: kasan_multi_shot
